<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Minigame Mayhem</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TOP BAR -->
  <header class="topbar">

    <div class="logo">
      MINIGAME<br>
      <span>MAYHEM</span>
    </div>

    <div class="top-stats">

      <div class="stat">
        🪙 <span id="coins">1,000</span>
      </div>

      <div class="stat">
        ⭐ Level <span id="level">1</span>
      </div>

      <button class="icon-button" onclick="openSettings()">
        ⚙️
      </button>

    </div>

  </header>


  <!-- MAIN HUB -->
  <main>

    <!-- PLAYER PROFILE -->
    <section class="hero">

      <div class="profile">

        <div class="avatar">
          <div class="avatar-eyes">
            <span></span>
            <span></span>
          </div>

          <div class="avatar-mouth"></div>
        </div>

        <div class="player-info">
          <h2>Player</h2>
          <p class="title">Chaos Starter</p>
        </div>

      </div>


      <!-- PLAY -->
      <button class="play-button" onclick="playGame()">
        PLAY
        <span>▶</span>
      </button>

    </section>


    <!-- MENU -->
    <section>

      <h2 class="section-title">MAYHEM HUB</h2>

      <div class="menu-grid">

        <button class="menu-card customize" onclick="customize()">
          <div class="menu-icon">😎</div>
          <div>
            <strong>Customize</strong>
            <small>Change your avatar</small>
          </div>
        </button>


        <button class="menu-card packs" onclick="packs()">
          <div class="menu-icon">📦</div>
          <div>
            <strong>Packs</strong>
            <small>Collect themed items</small>
          </div>
        </button>


        <button class="menu-card shop" onclick="shop()">
          <div class="menu-icon">🛒</div>
          <div>
            <strong>Shop</strong>
            <small>Spend your coins</small>
          </div>
        </button>


        <button class="menu-card leaderboard" onclick="leaderboard()">
          <div class="menu-icon">🏆</div>
          <div>
            <strong>Leaderboard</strong>
            <small>See who's winning</small>
          </div>
        </button>


        <button class="menu-card how-to" onclick="howToPlay()">
          <div class="menu-icon">❓</div>
          <div>
            <strong>How to Play</strong>
            <small>Learn the chaos</small>
          </div>
        </button>


        <button class="menu-card settings" onclick="openSettings()">
          <div class="menu-icon">⚙️</div>
          <div>
            <strong>Settings</strong>
            <small>Game preferences</small>
          </div>
        </button>

      </div>

    </section>


    <!-- DAILY CHALLENGE -->
    <section class="challenge">

      <div class="challenge-header">

        <div>
          <span class="challenge-label">🔥 DAILY CHALLENGE</span>
          <h3>Play 3 Minigames</h3>
        </div>

        <strong>0 / 3</strong>

      </div>

      <div class="progress">
        <div class="progress-fill"></div>
      </div>

      <p>Complete challenges to earn XP and coins.</p>

    </section>

  </main>


  <script src="game.js"></script>

</body>
</html>
